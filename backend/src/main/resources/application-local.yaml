spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ps_platform
    driver-class-name: org.postgresql.Driver
    username: ps_user
    password: ps_password
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  sql:
    init:
      mode: always
      data-locations:
        - optional:file:./seed-data.sql
