spring:
  application:
    name: backend
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:h2:mem:ps-platform;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      data-locations:
        - optional:file:./seed-data.sql

app:
  auth:
    jwt:
      secret: ${JWT_SECRET:backend-dev-secret-key-for-local-development-change-this}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}
