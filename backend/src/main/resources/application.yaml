spring:
  application:
    name: backend
  devtools:
    restart:
      enabled: true
      additional-paths:
        - src/main/java
        - src/main/resources
      poll-interval: 1s
      quiet-period: 400ms
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}


app:
  email-verification:
    code-hash-secret: ${EMAIL_VERIFICATION_CODE_HASH_SECRET}
    code-ttl-seconds: ${EMAIL_VERIFICATION_CODE_TTL_SECONDS:300}
    token-ttl-seconds: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:1800}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    from-email: ${EMAIL_VERIFICATION_FROM_EMAIL:}
  auth:
    jwt:
      secret: ${JWT_SECRET:backend-dev-secret-key-for-local-development-change-this}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}
  support:
    email:
      to-email: ${SUPPORT_TO_EMAIL:ypungkyu0317@gmail.com}
      from-email: ${SUPPORT_FROM_EMAIL:}
