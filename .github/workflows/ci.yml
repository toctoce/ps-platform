# 워크플로 이름
name: CI

# 실행 조건
on:
  pull_request: # PR 올릴 때
  push: # main 브랜치에 push 할 때
    branches:
      - main

jobs:
  test: # test 라는 작업 정의
    runs-on: ubuntu-latest # 실행 환경

    steps: # 단계 정의(순서대로)
      - name: 소스 코드 가져오기
        uses: actions/checkout@v6 # checkout 액션으로 소스코드를 다운받음

      - name: Java 21 설정
        uses: actions/setup-java@v5 # setup-java 액션으로 원하는 Java 버전을 준비함.
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Node.js 22 설정
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go 설정
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: judge-worker/go.sum

      - name: 워커 테스트
        working-directory: judge-worker
        run: go test ./...
